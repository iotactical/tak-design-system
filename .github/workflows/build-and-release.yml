name: Build and Release TAK Design System

on:
  push:
    branches: [main]
    paths:
      - 'tokens/**'
      - 'scripts/**'
      - 'packages/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'platforms/wintak/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Validate tokens
        run: npm run validate

      - name: Build and validate data registry
        run: npm run build:registry && node scripts/validate-registry.mjs

      - name: Validate doctrine data
        run: node scripts/validate-doctrine.mjs

  test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm test 2>&1 | tee test-output.txt

      - name: Generate test badge
        if: always()
        run: |
          TESTS=$(grep '# tests' test-output.txt | awk '{print $3}' || echo "0")
          PASS=$(grep '# pass' test-output.txt | awk '{print $3}' || echo "0")
          FAIL=$(grep '# fail' test-output.txt | awk '{print $3}' || echo "0")
          if [ "$FAIL" = "0" ]; then
            COLOR="brightgreen"
            STATUS="${PASS} passing"
          else
            COLOR="red"
            STATUS="${PASS}/${TESTS} passing, ${FAIL} failing"
          fi
          mkdir -p .badges
          echo "{\"schemaVersion\":1,\"label\":\"tests\",\"message\":\"${STATUS}\",\"color\":\"${COLOR}\"}" > .badges/tests.json

          # RTM coverage
          COMPLETE=$(grep -c ',COMPLETE,' .rtmx/database.csv || echo "0")
          TOTAL=$(( $(wc -l < .rtmx/database.csv) - 1 ))
          PCT=$(echo "scale=1; ${COMPLETE} * 100 / ${TOTAL}" | bc)
          if [ "$(echo "$PCT >= 90" | bc)" = "1" ]; then
            RTM_COLOR="brightgreen"
          elif [ "$(echo "$PCT >= 70" | bc)" = "1" ]; then
            RTM_COLOR="yellow"
          else
            RTM_COLOR="red"
          fi
          echo "{\"schemaVersion\":1,\"label\":\"requirements\",\"message\":\"${COMPLETE}/${TOTAL} (${PCT}%)\",\"color\":\"${RTM_COLOR}\"}" > .badges/rtm.json

      - name: Upload badge data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: badges
          path: .badges/

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build tokens and platform outputs
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test --project=desktop-chromium
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  build:
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Download badge data
        uses: actions/download-artifact@v4
        with:
          name: badges
          path: site/public/badges/
        continue-on-error: true

      - name: Build all platforms
        run: npm run build

      - name: Verify token outputs exist
        run: |
          test -f platforms/atak/res/values/tak_colors.xml
          test -f platforms/atak/res/values/tak_dimens.xml
          test -f platforms/atak/compose/generated/TakColors.kt
          test -f platforms/web/generated/tak-tokens.css
          test -f platforms/vscode/generated/tak-dark-theme.json
          echo "All platform outputs verified"

      - name: Verify CSS prefix
        run: |
          if grep -q '----tak-' platforms/web/generated/tak-tokens.css; then
            echo "ERROR: CSS double-prefix bug detected (----tak-*)"
            exit 1
          fi
          echo "CSS prefix verified: --tak-*"

      - name: Build React library
        run: npm run build:react

      - name: Package release
        run: npm run package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tak-design-system
          path: |
            dist/
            platforms/
            packages/react/dist/
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
      id-token: write
    env:
      # Surfaced as env so the publish steps can be skipped via `if:` when a
      # credential is absent; the `secrets` context is not available in `if:`.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run build && npm run build:react && npm run package

      - name: Get version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists; bump package.json to cut a new one."
            exit 0
          fi
          gh release create "v${VERSION}" dist/*.tar.gz \
            --title "TAK Design System v${VERSION}" \
            --generate-notes

      - name: Publish npm packages
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: ./scripts/publish-npm.sh

      - name: Warn when npm publishing is not configured
        if: env.NPM_TOKEN == ''
        run: |
          echo "::warning title=npm publish skipped::NPM_TOKEN secret is not configured; no packages were published."

      - name: Publish VS Code extension
        if: env.VSCE_PAT != ''
        run: |
          cp platforms/vscode/generated/tak-dark-theme.json vscode-extension/themes/tak-dark-theme.json
          cd vscode-extension
          LOCAL=$(jq -r .version package.json)
          EXTENSION="$(jq -r .publisher package.json).$(jq -r .name package.json)"
          PUBLISHED=$(npx @vscode/vsce show "$EXTENSION" --json 2>/dev/null | jq -r '.versions[0].version // empty' || true)
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "$EXTENSION $LOCAL is already on the marketplace; bump vscode-extension/package.json to publish."
            exit 0
          fi
          VSIX="tak-dark-theme-${LOCAL}.vsix"
          npx @vscode/vsce package --no-dependencies --out "$VSIX"
          npx @vscode/vsce publish --packagePath "$VSIX" -p "$VSCE_PAT"
          gh release upload "v${{ steps.version.outputs.version }}" "$VSIX" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Warn when VS Code publishing is not configured
        if: env.VSCE_PAT == ''
        run: |
          echo "::warning title=VS Code publish skipped::VSCE_PAT secret is not configured; the extension was not published."

      - name: Notify defense-builders-sdk
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh api repos/iotactical/defense-builders-sdk/dispatches \
            -f event_type=design-system-update \
            -f 'client_payload[version]'="${VERSION}" \
            || echo "Dispatch failed (expected if cross-repo token not configured)"

  wpf:
    runs-on: windows-latest
    if: >
      contains(github.event.head_commit.message, '[wpf]') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build WPF library
        run: dotnet build platforms/wintak/mil-sym-wpf/mil-sym-wpf.sln

      - name: Run WPF tests
        run: dotnet test platforms/wintak/mil-sym-wpf/mil-sym-wpf.sln

      - name: Package NuGet
        run: dotnet pack platforms/wintak/mil-sym-wpf/src/MilSymWpf/MilSymWpf.csproj -o artifacts/

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: mil-sym-wpf-nupkg
          path: artifacts/
          retention-days: 30
