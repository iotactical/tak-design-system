name: Build and Release TAK Design System

on:
  push:
    branches: [main]
    paths:
      - 'tokens/**'
      - 'scripts/**'
      - 'packages/**'
      - 'tests/**'
      - 'package.json'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Validate tokens
        run: npm run validate

  test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build all platforms
        run: npm run build

      - name: Verify token outputs exist
        run: |
          test -f platforms/atak/res/values/tak_colors.xml
          test -f platforms/atak/res/values/tak_dimens.xml
          test -f platforms/atak/compose/generated/TakColors.kt
          test -f platforms/web/generated/tak-tokens.css
          test -f platforms/vscode/generated/tak-dark-theme.json
          echo "All platform outputs verified"

      - name: Verify CSS prefix
        run: |
          if grep -q '----tak-' platforms/web/generated/tak-tokens.css; then
            echo "ERROR: CSS double-prefix bug detected (----tak-*)"
            exit 1
          fi
          echo "CSS prefix verified: --tak-*"

      - name: Build React library
        run: npm run build:react

      - name: Package release
        run: npm run package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tak-design-system
          path: |
            dist/
            platforms/
            packages/react/dist/
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run build && npm run build:react && npm run package

      - name: Get version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" dist/*.tar.gz \
            --title "TAK Design System v${VERSION}" \
            --generate-notes \
            || echo "Release v${VERSION} already exists, skipping"

      - name: Notify defense-builders-sdk
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh api repos/iotactical/defense-builders-sdk/dispatches \
            -f event_type=design-system-update \
            -f 'client_payload[version]'="${VERSION}" \
            || echo "Dispatch failed (expected if cross-repo token not configured)"
