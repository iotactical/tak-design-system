# RTMX Configuration
# See https://rtmx.ai for documentation

rtmx:
  database: .rtmx/database.csv
  requirements_dir: .rtmx/requirements
  schema: core
  phases:
    1: Foundation
    2: Core Features
    3: ATAK Parity
    4: Asset Packs
  test_dir: tests
  languages:
    - javascript
  file_extensions:
    - .mjs
    - .js
  pytest:
    marker_prefix: "req"
    register_markers: true
