<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://server.arcgisonline.com; worker-src 'self' blob:; connect-src 'self' https://*.basemaps.cartocdn.com https://server.arcgisonline.com" />
    <title>TAK Design System</title>
    <script>
      // SPA route restore: if redirected from 404.html, restore the deep-link path
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.pathname) {
          history.replaceState(null, null, '/tak-design-system' + redirect);
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/tak-design-system/favicon.svg" />
    <link rel="stylesheet" href="/tak-design-system/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
